name: test

on:
  push:
    branches: [main, "[0-9]+.[0-9]+.x"]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Headless 3D report rendering (pyvista/VTK) can hang on a misconfigured
    # display; cap the job so it fails fast instead of running to the 6h ceiling.
    timeout-minutes: 60

    defaults:
      run:
        shell: bash -e {0} # -e to fail on error

    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]

    name: Python ${{ matrix.python }} integration

    env:
      PYTHON: ${{ matrix.python }}
      TEST_DATA_CATALOG: https://yanglab.westlake.edu.cn/data/gsMap/gsMap3D-r1/catalog.json
      TEST_DATA_DIR: ${{ github.workspace }}/resources/ci-test-data
      WORK_DIR: ${{ github.workspace }}/gsmap_workdir

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up headless display for pyvista/VTK 3D rendering
        uses: pyvista/setup-headless-display-action@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          # `tests` is a dependency-group (PEP 735); CPU torch since the runner has no GPU.
          uv pip install --system --torch-backend=cpu -e . --group tests

      - name: Build distribution packages
        run: |
          uv build
          ls -lh dist

      - name: Verify built packages
        run: |
          python -m pip install twine
          twine check dist/*

      - name: Store distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-py${{ matrix.python }}
          path: dist/

      - name: Create workdir
        run: |
          mkdir -p $WORK_DIR
          echo "Created workdir: $WORK_DIR"

      - name: Cache test data
        uses: actions/cache@v3
        id: cache-test-data
        with:
          path: ${{ env.TEST_DATA_DIR }}
          key: gsmap3d-ci-test-data-r1-sha256

      - name: Download and extract test data
        run: |
          python tests/tools/fetch_resources.py \
              --catalog "$TEST_DATA_CATALOG" \
              --destination resources ci-test-data

      - name: Run pytest
        env:
          MPLBACKEND: agg
          # DISPLAY is provided by setup-headless-display-action (Xvfb); do not
          # hard-code :0 — that points at a nonexistent server and hangs VTK.
          COLUMNS: 120
        run: |
          python -m pytest tests --cov=src \
              --junitxml=junit.xml -o junit_family=legacy \
              --cov-report=term-missing \
              --cov-report=xml \
              --cov-config=.coveragerc \
              -v -s --color=yes \
              --timeout=600 --timeout-method=thread \
              --run-real-data \
              --work-dir=$WORK_DIR \
              --test-data=$TEST_DATA_DIR

      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
