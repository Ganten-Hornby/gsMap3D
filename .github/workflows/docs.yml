name: docs

on:
  push:
    branches:
      - main
      - revision/graph-3d-20260807
    paths:
      - "docs/**"
      - "src/gsMap/config/**"
      - "src/gsMap/cli.py"
      - "pyproject.toml"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # `doc` is a dependency-group (PEP 735); torch is pinned to the CPU
          # wheel since the docs runner has no GPU.
          uv pip install --system --torch-backend=cpu . --group doc

      - name: Build documentation
        run: |
          python docs/tools/generate_cli_reference.py
          python docs/tools/generate_downloads.py --catalog docs/resource_catalog.json
          git diff --exit-code -- docs/source/cli_reference.md
          git diff --exit-code -- docs/source/downloads.md
          sphinx-build -W --keep-going -b html docs/source docs/build/html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs/build/html"

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
