name: Release Pipeline

# This is the main release workflow that handles everything when you push a version tag
# Pre-releases publish Python packages only and never replace stable Docker tags.
on:
  push:
    tags:
      - "v*" # Trigger ONLY on version tags
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v1.0.0)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-python:
    name: Build Python distribution 📦
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install release validation tools
        run: python -m pip install packaging twine
      - name: Validate release tag and package version
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python .github/scripts/release_metadata.py "$RELEASE_TAG"
      - name: Build package
        run: |
          uv build --no-sources
          python -m twine check --strict dist/*
          ls -lh dist
      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    name: Publish to PyPI 🐍
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gsMap3D
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  build-docker:
    name: Build Docker images 🐳
    needs: build-python
    if: needs.build-python.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.build-python.outputs.tag }}

      - name: Convert repository name to lowercase
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ steps.repo.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  create-release:
    name: Create GitHub Release 📝
    needs: [build-python, publish-pypi, build-docker]
    if: >-
      ${{ !cancelled() && needs.publish-pypi.result == 'success' &&
          (needs.build-docker.result == 'success' || needs.build-docker.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.build-python.outputs.tag }}
          fetch-depth: 0

      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Sign distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl

      - name: Generate Release Notes
        id: release_notes
        env:
          RELEASE_TAG: ${{ needs.build-python.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build-python.outputs.version }}
          PRERELEASE: ${{ needs.build-python.outputs.prerelease }}
        run: |
          VERSION="$RELEASE_TAG"
          echo "# gsMap3D ${VERSION}" > release_notes.md
          echo "" >> release_notes.md
          echo "## 📦 Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "### PyPI" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "pip install gsMap3D==${RELEASE_VERSION}" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          if [ "$PRERELEASE" = "false" ]; then
            echo "### Docker" >> release_notes.md
            echo '```bash' >> release_notes.md
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_VERSION}" >> release_notes.md
            echo '```' >> release_notes.md
          else
            echo "This is a pre-release for testing. Stable Docker tags are unchanged." >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "## 📋 What's Changed" >> release_notes.md
          echo "" >> release_notes.md
          PREVIOUS_TAG=$(git describe --tags --match 'v*' --abbrev=0 "${VERSION}^" 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "See [full changelog](https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${VERSION})" >> release_notes.md
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-python.outputs.tag }}
          PRERELEASE: ${{ needs.build-python.outputs.prerelease }}
        run: |
          RELEASE_FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then
            RELEASE_FLAGS+=(--prerelease --latest=false)
          fi
          gh release create \
            "$RELEASE_TAG" \
            --repo '${{ github.repository }}' \
            --verify-tag \
            --title "gsMap3D $RELEASE_TAG" \
            "${RELEASE_FLAGS[@]}" \
            --notes-file release_notes.md

      - name: Upload artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-python.outputs.tag }}
        run: |
          gh release upload \
            "$RELEASE_TAG" dist/** \
            --repo '${{ github.repository }}'
